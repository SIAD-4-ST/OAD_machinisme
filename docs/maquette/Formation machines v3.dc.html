isplay: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 0; border: 1px solid var(--hairline); text-decoration: none; color: var(--ink);\" style-hover=\"border-color: var(--gold-deep);\"><span style=\"font-size: .78rem; color: var(--ink-muted);\">← Précédent<\u002Fspan><span style=\"font-weight: 500;\">{{ prec.titre }}<\u002Fspan><\u002Fa><\u002Fsc-if>\n                <sc-if value=\"{{ aSuiv }}\"><a href=\"{{ suiv.lien }}\" style=\"flex: 1 1 220px; display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 0; background: var(--accent); text-decoration: none; color: var(--on-accent); text-align: right; margin-left: auto;\" style-hover=\"background: var(--accent-hover);\"><span style=\"font-size: .78rem; opacity: .85;\">Suivant →<\u002Fspan><span style=\"font-weight: 500;\">{{ suiv.titre }}<\u002Fspan><\u002Fa><\u002Fsc-if>\n              <\u002Fnav>\n            <\u002Fsc-if>\n          <\u002Farticle>\n\n          <sc-if value=\"{{ estModule }}\">\n            <nav data-noprint=\"\" aria-label=\"Sommaire du module\" style=\"flex: 1 1 260px; position: sticky; top: 84px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 0; padding: 18px 12px 12px;\">\n              <div style=\"padding: 0 8px 12px;\">\n                <h2 style=\"font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-family: var(--font-signal); color: var(--ink-muted); margin: 0 0 8px;\">Sommaire<\u002Fh2>\n                <p style=\"margin: 0 0 6px; font-size: .88rem; color: var(--ink-muted);\">{{ mod.avancementTxt }}<\u002Fp>\n                <div role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{ mod.pct }}\" aria-label=\"{{ mod.jaugeLabel }}\" style=\"height: 6px; border-radius: 999px; background: var(--surface-alt); overflow: hidden;\"><span style=\"display: block; height: 100%; background: var(--accent); border-radius: 999px; width: {{ mod.pct }}%;\"><\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <ol style=\"list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px;\">\n                <sc-for list=\"{{ sommaire }}\" as=\"it\" hint-placeholder-count=\"5\">\n                  <li>\n                    <a href=\"{{ it.lien }}\" aria-current=\"{{ it.courant }}\" style=\"display: grid; grid-template-columns: 24px 1fr; gap: 0 10px; align-items: start; padding: 8px; min-height: 44px; border-radius: 0; color: var(--ink); text-decoration: none; background: {{ it.fond }};\" style-hover=\"background: var(--surface-alt);\">\n                      <span aria-hidden=\"true\" style=\"width: 24px; height: 24px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 700; margin-top: 1px; border: 1.5px solid {{ it.pastilleBord }}; background: {{ it.pastilleFond }}; color: {{ it.pastilleCouleur }};\">{{ it.pastille }}<\u002Fspan>\n                      <span style=\"display: flex; flex-direction: column; min-width: 0;\">\n                        <span style=\"font-size: .72rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .05em;\">{{ it.typeLibelle }}<\u002Fspan>\n                        <span style=\"font-size: .92rem; line-height: 1.35; font-weight: {{ it.poids }};\">{{ it.titre }}<\u002Fspan>\n                      <\u002Fspan>\n                      <sc-if value=\"{{ it.vu }}\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);\">(consultée)<\u002Fspan><\u002Fsc-if>\n                    <\u002Fa>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Fol>\n            <\u002Fnav>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ estOutils }}\">\n            <nav data-noprint=\"\" aria-label=\"Liste des calculateurs\" style=\"flex: 1 1 260px; position: sticky; top: 84px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 0; padding: 18px 12px 12px;\">\n              <h2 style=\"font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-family: var(--font-signal); color: var(--ink-muted); margin: 0 8px 10px;\">Calculateurs<\u002Fh2>\n              <ul style=\"list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px;\">\n                <sc-for list=\"{{ outilsListe }}\" as=\"ou\" hint-placeholder-count=\"5\">\n                  <li><a href=\"{{ ou.lien }}\" aria-current=\"{{ ou.courant }}\" style=\"display: flex; align-items: center; padding: 8px 10px; min-height: 44px; border-radius: 0; text-decoration: none; font-size: .94rem; line-height: 1.35; color: var(--ink); background: {{ ou.fond }}; font-weight: {{ ou.poids }};\" style-hover=\"background: var(--surface-alt);\">{{ ou.titre }}<\u002Fa><\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fnav>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Progression -->\n      <sc-if value=\"{{ estProgression }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"font-family: var(--font-display); font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.1; letter-spacing: -0.025em; margin: 12px 0 10px; font-weight: 300;\">Ma progression<\u002Fh1>\n        <p style=\"color: var(--ink-muted); margin: 0 0 24px; font-size: 1.06rem;\">{{ progResume }}<\u002Fp>\n        <div style=\"overflow-x: auto; max-width: 100%; background: var(--surface); border: 1px solid var(--hairline); border-radius: 0; box-shadow: var(--ombre);\">{{ tableauProgression }}<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px;\">\n          <p style=\"color: var(--ink-muted); font-size: .9rem; margin: 0;\">La progression est enregistrée sur cet appareil uniquement, dans ce navigateur.<\u002Fp>\n          <button sc-camel-on-click=\"{{ effacerProgression }}\" style=\"min-height: 48px; padding: 8px 26px; border-radius: 9999px; font-family: var(--font-signal); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; border: 1px solid var(--erreur); background: var(--surface); color: var(--erreur); font-weight: 500;\" style-hover=\"background: var(--erreur-fond);\">Effacer ma progression<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <footer data-noprint=\"\" style=\"border-top: 1px solid var(--hairline); background: var(--surface);\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 16px 20px 22px; color: var(--ink-muted); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 4px 24px; justify-content: space-between;\">\n      <p style=\"margin: 0; max-width: 70ch;\">Outil de formation. Les valeurs proposées dans les calculateurs sont des exemples : l'origine de chacune est indiquée sous son champ.<\u002Fp>\n      <sc-if value=\"{{ aEdition }}\"><p style=\"margin: 0;\">{{ editionTxt }}<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CLE_PROGRESSION = 'formation-machines:progression:v1';\nconst VERSION_PROGRESSION = 1;\nconst CLE_THEME = 'formation-machines:theme:v1';\nconst THEMES = ['auto', 'clair', 'sombre'];\nconst THEMES_LIBELLES = { auto: 'automatique', clair: 'clair', sombre: 'sombre' };\nconst STATUT_STYLES = {\n  brouillon: ['var(--alerte-fond)', 'var(--alerte-bord)'],\n  'a-valider': ['var(--alerte-fond)', 'var(--alerte-bord)'],\n  valide: ['var(--succes-fond)', 'var(--succes)']\n};\nconst LETTRES = 'ABCDEFGHIJ';\nconst S_TH = { border: 0, borderBottom: '1px solid var(--hairline)', padding: '12px 14px', textAlign: 'left', verticalAlign: 'top' };\nconst S_TD = Object.assign({}, S_TH);\nconst S_THEAD = Object.assign({}, S_TH, { background: 'var(--surface-alt)', fontSize: '.82rem', fontWeight: 650, color: 'var(--ink-muted)', whiteSpace: 'nowrap' });\nconst S_TABLE = { borderCollapse: 'collapse', width: '100%', fontSize: '.94rem' };\nconst S_CAPTION = { textAlign: 'left', fontWeight: 650, padding: '12px 14px' };\n\nfunction lireProgression() {\n  try {\n    const brut = window.localStorage.getItem(CLE_PROGRESSION);\n    if (!brut) return null;\n    const o = JSON.parse(brut);\n    return (o && o.version === VERSION_PROGRESSION && o.modules && typeof o.modules === 'object') ? o : null;\n  } catch (e) { return null; }\n}\nfunction ecrireProgression(p) { try { window.localStorage.setItem(CLE_PROGRESSION, JSON.stringify(p)); } catch (e) {} }\nfunction effacerProgressionStockee() { try { window.localStorage.removeItem(CLE_PROGRESSION); } catch (e) {} }\nfunction lireTheme() {\n  try { const t = window.localStorage.getItem(CLE_THEME); return THEMES.includes(t) ? t : 'auto'; }\n  catch (e) { return 'auto'; }\n}\nfunction ecrireTheme(t) { try { window.localStorage.setItem(CLE_THEME, t); } catch (e) {} }\nfunction lireHash() { try { return (window.location && window.location.hash) || ''; } catch (e) { return ''; } }\nfunction ordreContenu() {\n  try {\n    const vus = [];\n    Array.from(document.querySelectorAll('script[src*=\"contenu/\"]')).forEach(s => {\n      const id = (s.getAttribute('src') || '').replace(/^.*contenu\\//, '').replace(/\\.js$/, '');\n      if (!vus.includes(id)) vus.push(id);\n    });\n    return vus;\n  } catch (e) { return []; }\n}\nfunction moteurPret() {\n  if (!window.OAD) return false;\n  const attendus = ordreContenu().length;\n  return attendus === 0 || window.OAD.modules().length >= attendus;\n}\n\nconst ESPACE = '\\u00a0';\nfunction fmtNombre(x, decimales) {\n  if (typeof x !== 'number' || !Number.isFinite(x)) return '—';\n  const d = Number.isInteger(decimales) ? decimales : 2;\n  const txt = Math.abs(x).toLocaleString('fr-FR', { maximumFractionDigits: d });\n  return (x < 0 && txt !== '0' ? '−' : '') + txt;\n}\nfunction avecUnite(txt, unite) { return unite ? txt + ESPACE + unite : txt; }\nfunction pourcent(taux) { return fmtNombre(Math.round((Number(taux) || 0) * 100), 0) + ESPACE + '%'; }\nfunction dateFr(iso) {\n  const m = /^(\\d{4})-(\\d{2})-(\\d{2})/.exec(String(iso || ''));\n  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';\n}\nfunction texteSaisie(n) { return String(n).replace('.', ','); }\nfunction versNombre(txt) {\n  const s = String(txt == null ? '' : txt).replace(/[\\s\\u00a0\\u202f]/g, '').replace(',', '.');\n  return s === '' ? NaN : Number(s);\n}\nfunction versListe(txt) {\n  return String(txt == null ? '' : txt).split(';').filter(m => m.trim() !== '').map(versNombre);\n}\nfunction texteListe(tab) {\n  return (Array.isArray(tab) ? tab : []).map(n => Number(n).toFixed(2).replace('.', ',')).join(' ; ');\n}\nfunction pourcentSigne(fraction, decimales) {\n  const x = Number(fraction) * 100;\n  if (!Number.isFinite(x)) return '—';\n  return (x > 0 ? '+' : '') + fmtNombre(x, decimales) + ESPACE + '%';\n}\nfunction valeurDe(e) { const t = e && (e.currentTarget || e.target); return t ? String(t.value) : ''; }\nfunction attributDe(e, nom) { const t = e && (e.currentTarget || e.target); return t && t.getAttribute ? t.getAttribute(nom) : null; }\nfunction statutStyle(s) { const x = STATUT_STYLES[s] || ['var(--surface-alt)', 'var(--control-border)']; return { fond: x[0], bord: x[1] }; }\nfunction styleCoche(fait) {\n  return { fond: fait ? 'var(--surface-alt)' : 'var(--surface)', couleur: fait ? 'var(--ink-muted)' : 'var(--ink)', deco: fait ? 'line-through' : 'none' };\n}\n// État visuel d'un choix : neutre, pris, bonne, fausse.\nfunction styleChoix(etat, lettre) {\n  if (etat === 'bonne') return { bord: 'var(--succes)', fond: 'var(--succes-fond)', marqueFond: 'var(--succes)', marqueCouleur: 'var(--surface)', marque: '✓' };\n  if (etat === 'fausse') return { bord: 'var(--erreur)', fond: 'var(--erreur-fond)', marqueFond: 'var(--erreur)', marqueCouleur: 'var(--surface)', marque: '✕' };\n  if (etat === 'pris') return { bord: 'var(--accent)', fond: 'var(--accent-soft)', marqueFond: 'var(--accent)', marqueCouleur: 'var(--on-accent)', marque: lettre };\n  return { bord: 'var(--control-border)', fond: 'var(--surface)', marqueFond: 'transparent', marqueCouleur: 'var(--ink-muted)', marque: lettre };\n}\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const OAD = window.OAD || null;\n    this.state = {\n      pret: moteurPret(), echec: false,\n      route: OAD ? OAD.lireRoute(lireHash()) : null,\n      ordre: ordreContenu(), prog: lireProgression(), theme: lireTheme(),\n      saisies: {}, quizRep: {}, quizScore: {}, casChoix: {}, exoRep: {}, exoCorr: {}\n    };\n    this.__essais = 0;\n    this.__minuteur = null;\n    this.__derniereRoute = null;\n    this.__dernierProg = this.state.prog ? JSON.stringify(this.state.prog) : null;\n\n    this.onHash = () => { if (window.OAD) this.setState({ route: window.OAD.lireRoute(lireHash()) }); };\n    this.attendreMoteur = () => {\n      this.__minuteur = null;\n      if (moteurPret()) {\n        this.setState({ pret: true, ordre: ordreContenu(), route: window.OAD.lireRoute(lireHash()) });\n        return;\n      }\n      this.__essais += 1;\n      if (this.__essais > 200) {\n        if (window.OAD) this.setState({ pret: true, ordre: ordreContenu(), route: window.OAD.lireRoute(lireHash()) });\n        else this.setState({ echec: true });\n        return;\n      }\n      this.__minuteur = setTimeout(this.attendreMoteur, 50);\n    };\n    this.onSaisie = (e) => {\n      const calc = attributDe(e, 'data-calc'), entree = attributDe(e, 'data-entree'), val = valeurDe(e);\n      if (!calc || !entree) return;\n      this.setState(s => ({ saisies: { ...s.saisies, [calc]: { ...(s.saisies[calc] || {}), [entree]: val } } }));\n    };\n    this.reinitialiserCalc = (e) => {\n      const id = valeurDe(e);\n      this.setState(s => { const n = { ...s.saisies }; delete n[id]; return { saisies: n }; });\n    };\n    this.onChoix = (e) => {\n      const [sid, qid, k] = valeurDe(e).split('|');\n      const idx = Number(k);\n      const section = this.sectionCourante();\n      if (!section || section.id !== sid) return;\n      const q = (section.questions || []).find(x => x.id === qid);\n      if (!q || !Number.isInteger(idx)) return;\n      const multiple = q.bonnes.length > 1;\n      this.setState(s => {\n        if (s.quizScore[sid]) return {};\n        const rep = { ...(s.quizRep[sid] || {}) };\n        const cur = rep[qid] || [];\n        rep[qid] = multiple ? (cur.includes(idx) ? cur.filter(x => x !== idx) : [...cur, idx]) : [idx];\n        return { quizRep: { ...s.quizRep, [sid]: rep } };\n      });\n    };\n    this.validerQuiz = (e) => {\n      const sid = valeurDe(e);\n      const ctx = this.contexte();\n      if (!ctx || !ctx.module || !ctx.section || ctx.section.id !== sid) return;\n      const exo = ctx.section.type === 'exercice';\n      const corr = exo ? ctx.OAD.corrigerExercice(ctx.section, versNombre(this.state.exoRep[sid])) : null;\n      const score = exo\n        ? { taux: corr.juste ? 1 : 0, bonnes: corr.juste ? 1 : 0, total: 1 }\n        : ctx.OAD.noterQuiz(ctx.section, this.state.quizRep[sid] || {});\n      const dateISO = new Date().toISOString();\n      this.setState(s => Object.assign(exo\n        ? { exoCorr: { ...s.exoCorr, [sid]: corr } }\n        : { quizScore: { ...s.quizScore, [sid]: score } },\n        { prog: ctx.OAD.enregistrerQuiz(this.progression(s), ctx.module.id, sid, score, dateISO) }));\n    };\n    this.recommencerQuiz = (e) => {\n      const sid = valeurDe(e);\n      this.setState(s => { const rep = { ...s.quizRep }, sc = { ...s.quizScore }; delete rep[sid]; delete sc[sid]; return { quizRep: rep, quizScore: sc }; });\n    };\n    this.onReponseExo = (e) => {\n      const sid = attributDe(e, 'data-exo'), val = valeurDe(e);\n      if (!sid) return;\n      this.setState(s => (s.exoCorr[sid] ? {} : { exoRep: { ...s.exoRep, [sid]: val } }));\n    };\n    this.verifierExo = (e) => this.validerQuiz(e);\n    this.recommencerExo = (e) => {\n      const sid = valeurDe(e);\n      this.setState(s => { const rep = { ...s.exoRep }, corr = { ...s.exoCorr }; delete rep[sid]; delete corr[sid]; return { exoRep: rep, exoCorr: corr }; });\n    };\n    this.choisirCas = (e) => {\n      const [sid, k] = valeurDe(e).split('|');\n      const idx = Number(k);\n      if (!sid || !Number.isInteger(idx)) return;\n      this.setState(s => ({ casChoix: { ...s.casChoix, [sid]: idx } }));\n    };\n    this.basculerEtape = (e) => {\n      const id = attributDe(e, 'data-etape');\n      const ctx = this.contexte();\n      if (!id || !ctx || !ctx.module || !ctx.section) return;\n      this.setState(s => ({ prog: ctx.OAD.basculerEtape(this.progression(s), ctx.module.id, ctx.section.id, id) }));\n    };\n    this.basculerTache = (e) => {\n      const id = attributDe(e, 'data-tache');\n      const ctx = this.contexte();\n      if (!id || !ctx || !ctx.module || !ctx.section) return;\n      this.setState(s => ({ prog: ctx.OAD.basculerTache(this.progression(s), ctx.module.id, ctx.section.id, id) }));\n    };\n    this.effacerProgression = () => {\n      if (!window.OAD) return;\n      if (typeof window.confirm === 'function' && !window.confirm('Effacer toute la progression enregistrée sur cet appareil ?')) return;\n      effacerProgressionStockee();\n      this.__dernierProg = null;\n      this.setState({ prog: window.OAD.progressionVide(), quizRep: {}, quizScore: {}, casChoix: {}, exoRep: {}, exoCorr: {} });\n    };\n    this.basculerTheme = () => {\n      this.setState(s => { const t = THEMES[(THEMES.indexOf(s.theme) + 1) % THEMES.length]; ecrireTheme(t); return { theme: t }; });\n    };\n    this.imprimer = () => { try { window.print(); } catch (e) {} };\n  }\n\n  componentDidMount() {\n    window.addEventListener('hashchange', this.onHash);\n    this.appliquerTheme();\n    if (this.state.pret) this.apresRendu(); else this.attendreMoteur();\n  }\n  componentDidUpdate() { this.appliquerTheme(); this.apresRendu(); }\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this.onHash);\n    if (this.__minuteur) clearTimeout(this.__minuteur);\n  }\n  appliquerTheme() {\n    try {\n      const el = document.documentElement;\n      const t = this.state.theme;\n      const sombre = t === 'sombre' || (t === 'auto' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);\n      el.setAttribute('data-theme', sombre ? 'sombre' : 'clair');\n    } catch (e) {}\n  }\n  apresRendu() {\n    if (!window.OAD || !this.state.pret) return;\n    const ctx = this.contexte();\n    const cle = JSON.stringify(ctx.route);\n    if (cle !== this.__derniereRoute) {\n      this.__derniereRoute = cle;\n      try { window.scrollTo(0, 0); } catch (e) {}\n      if (ctx.module && ctx.section) {\n        const p = this.progression(this.state);\n        const n = ctx.OAD.marquerVue(p, ctx.module.id, ctx.section.id);\n        if (n !== p) { this.setState({ prog: n }); return; }\n      }\n    }\n    if (this.state.prog) {\n      const inst = JSON.stringify(this.state.prog);\n      if (inst !== this.__dernierProg) { this.__dernierProg = inst; ecrireProgression(this.state.prog); }\n    }\n  }\n  progression(s) { return (s && s.prog) || window.OAD.progressionVide(); }\n  contexte() {\n    const OAD = window.OAD;\n    if (!OAD) return null;\n    const modules = OAD.ordonnerModules(OAD.modules(), this.state.ordre);\n    const route = this.state.route || OAD.lireRoute('');\n    let module = null, section = null;\n    if (route.vue === 'module') {\n      module = OAD.trouverModule(modules, route.moduleId);\n      if (module) section = (route.sectionId && OAD.trouverSection(modules, module.id, route.sectionId)) || (module.sections && module.sections[0]) || null;\n    }\n    return { OAD, modules, route, module, section };\n  }\n  sectionCourante() { const c = this.contexte(); return c ? c.section : null; }\n\n  navItems(courants, liens) {\n    return [['Modules', 'catalogue'], ['Calculateurs', 'outils'], ['Progression', 'progression'], ['Glossaire', 'glossaire']].map(([libelle, k]) => {\n      const c = courants[k];\n      const actif = c === 'page';\n      return {\n        libelle, lien: liens[k], courant: c,\n        fond: actif || c ? 'var(--accent)' : 'transparent',\n        couleur: actif || c ? 'var(--ink)' : 'var(--ink-muted)'\n      };\n    });\n  }\n\n  valeursVides() {\n    const t = this.state.theme;\n    const liens = { catalogue: '#/', outils: '#/outils', progression: '#/progression', glossaire: '#/module/glossaire' };\n    return {\n      enChargement: true, echecChargement: false,\n      lienCatalogue: liens.catalogue, lienProgression: liens.progression,\n      navItems: this.navItems({}, liens),\n      themeLibelle: { auto: '◐ Auto', clair: '○ Clair', sombre: '● Sombre' }[t],\n      themeAria: 'Changer de thème (actuel : ' + THEMES_LIBELLES[t] + ')',\n      aErreurs: false, erreursListe: [],\n      estCatalogue: false, estModule: false, estOutils: false, estProgression: false, estInconnu: false,\n      aGrille: false, domainesCatalogue: [], reprise: {}, bilan: { maitrises: 0, surTxt: '', pct: 0 },\n      mod: { aChiffresSansSource: false, chiffresSansSourceTxt: '' }, sommaire: [],\n      section: { aTechno: false, technoLibelle: '', aSourceEntete: false, sourceTxt: '' },\n      estFiche: false, estProcedure: false, estEntretien: false, estCalculateur: false, estQuiz: false, estCas: false,\n      estExercice: false, estDefinitions: false, definitions: [],\n      exo: { sid: '', enonce: '', aSource: false, sourceTxt: '', inputId: '', uniteTxt: '', reponse: '', corrige: false, nonCorrige: true,\n        verdict: '', retourFond: '', attenduTxt: '', etapes: [], aDernier: false, dernierTxt: '' },\n      blocs: [], procedure: { etapes: [], pct: 0 }, entretien: { groupes: [], pct: 0 },\n      quiz: { questions: [], nonCorrige: true },\n      cas: { options: [], aSource: false, sourceTxt: '', aSourceRetour: false, sourceRetourTxt: '' },\n      aPrec: false, aSuiv: false, prec: {}, suiv: {},\n      outilsListe: [], outilsTitre: '', outilsMessage: '',\n      aCalc: false, calcCourant: { entrees: [], etapes: [], resultats: [], alertes: [], technosTxt: '', aTechnos: false, tableau: null, aTableau: false },\n      progResume: '', tableauProgression: null,\n      aEdition: false, editionTxt: '',\n      basculerTheme: this.basculerTheme, onSaisie: this.onSaisie, reinitialiserCalc: this.reinitialiserCalc,\n      onChoix: this.onChoix, validerQuiz: this.validerQuiz, recommencerQuiz: this.recommencerQuiz,\n      choisirCas: this.choisirCas, basculerEtape: this.basculerEtape, basculerTache: this.basculerTache,\n      onReponseExo: this.onReponseExo, verifierExo: this.verifierExo, recommencerExo: this.recommencerExo,\n      effacerProgression: this.effacerProgression, imprimer: this.imprimer\n    };\n  }\n\n  renderVals() {\n    const out = this.valeursVides();\n    if (!window.OAD || !this.state.pret) {\n      out.enChargement = !this.state.echec;\n      out.echecChargement = !!this.state.echec;\n      return out;\n    }\n    const ctx = this.contexte();\n    const OAD = ctx.OAD;\n    const prog = this.progression(this.state);\n    const vue = ctx.route.vue;\n    out.enChargement = false;\n    out.editionTxt = OAD.EDITION_CONTENU ? 'Édition du contenu : ' + dateFr(OAD.EDITION_CONTENU) : '';\n    out.aEdition = !!out.editionTxt;\n    const liens = { catalogue: OAD.lien(), outils: OAD.lien('outils'), progression: OAD.lien('progression'), glossaire: OAD.lien('module', 'glossaire') };\n    out.lienCatalogue = liens.catalogue;\n    out.lienProgression = liens.progression;\n    const glossaire = vue === 'module' && OAD.estModuleReference(ctx.module);\n    out.navItems = this.navItems({\n      glossaire: glossaire ? 'page' : null,\n      catalogue: vue === 'catalogue' ? 'page' : (vue === 'module' && !glossaire ? 'true' : null),\n      outils: vue === 'outils' ? 'page' : null,\n      progression: vue === 'progression' ? 'page' : null\n    }, liens);\n    const erreurs = OAD.erreursContenu(ctx.modules);\n    if (ctx.modules.length === 0) erreurs.push('aucun module chargé');\n    out.aErreurs = erreurs.length > 0;\n    out.erreursListe = erreurs;\n    if (vue === 'module') Object.assign(out, this.valsModule(ctx, prog));\n    else if (vue === 'outils') Object.assign(out, this.valsOutils(ctx));\n    else if (vue === 'progression') Object.assign(out, this.valsProgression(ctx, prog));\n    else Object.assign(out, this.valsCatalogue(ctx, prog));\n    return out;\n  }\n\n  quizTxt(OAD, m, prog) {\n    const b = OAD.bilanEvaluation(prog, m);\n    return b.total ? 'Quiz réussis : ' + b.reussies + ' / ' + b.total : 'Pas de quiz dans ce module';\n  }\n  carte(OAD, m, prog) {\n    const a = OAD.avancement(prog, m);\n    const pct = Math.round(a.taux * 100);\n    const st = statutStyle(m.statut);\n    return {\n      quizTxt: this.quizTxt(OAD, m, prog),\n      id: m.id, titre: m.titre, resume: m.resume, lien: OAD.lien('module', m.id),\n      statutLibelle: OAD.STATUTS_LIBELLES[m.statut] || m.statut,\n      statutFond: st.fond, statutBord: st.bord,\n      dureeTxt: m.dureeMin ? 'Environ ' + fmtNombre(m.dureeMin, 0) + ESPACE + 'min' : '',\n      etatLibelle: OAD.ETATS_MODULE_LIBELLES[OAD.etatModule(prog, m)],\n      avancementTxt: a.vues + ' / ' + a.total + ' sections',\n      pct, jaugeLabel: 'Sections consultées : ' + a.vues + ' sur ' + a.total\n    };\n  }\n  valsCatalogue(ctx, prog) {\n    const OAD = ctx.OAD;\n    const suivis = ctx.modules.filter(m => !OAD.estModuleReference(m));\n    const maitrises = suivis.filter(m => OAD.etatModule(prog, m) === 'maitrise').length;\n    return {\n      estCatalogue: true, reprise: this.reprise(OAD, suivis, prog),\n      bilan: {\n        maitrises,\n        surTxt: 'sur ' + suivis.length + ' module' + (suivis.length > 1 ? 's' : '') + ' maîtrisé' + (maitrises > 1 ? 's' : ''),\n        pct: suivis.length ? Math.round(maitrises / suivis.length * 100) : 0\n      },\n      domainesCatalogue: OAD.DOMAINES.filter(d => d !== 'transversal').map(d => {\n        const modules = OAD.listerModules(ctx.modules, { domaine: d }).map(m => this.carte(OAD, m, prog));\n        return {\n          titreId: 'domaine-' + d, libelle: OAD.DOMAINES_LIBELLES[d], modules,\n          nbTxt: modules.length + ' module' + (modules.length > 1 ? 's' : '')\n        };\n      }).filter(g => g.modules.length > 0)\n    };\n  }\n  reprise(OAD, suivis, prog) {\n    const entame = suivis.find(m => OAD.etatModule(prog, m) !== 'maitrise' && OAD.avancement(prog, m).vues > 0);\n    const m = entame || suivis.find(x => OAD.etatModule(prog, x) !== 'maitrise');\n    if (!m) return { eyebrow: 'Parcours terminé', titre: 'Tous les modules sont maîtrisés', detail: 'Vous pouvez revoir un module ou refaire un quiz.', action: 'Voir ma progression', lien: OAD.lien('progression') };\n    const s = m.sections.find(x => !OAD.progressionSection(prog, m.id, x.id).vue) || m.sections[0];\n    return { eyebrow: entame ? 'Reprendre là où vous en étiez' : 'Pour commencer', titre: m.titre, detail: 'Section suivante : ' + s.titre, action: entame ? 'Reprendre' : 'Commencer', lien: OAD.lien('module', m.id, s.id) };\n  }\n  sourceTxt(m, code) {\n    const s = code && Array.isArray(m.sources) ? m.sources.find(x => x && x.code === code) : null;\n    return s ? 'Source : ' + s.reference + ' (' + s.date + (s.page ? ', p. ' + s.page : '') + ')' : '';\n  }\n  sourceVals(m, el) { const t = this.sourceTxt(m, el && el.source); return { aSource: !!t, sourceTxt: t }; }\n\n  tableauBloc(bloc) {\n    const e = React.createElement;\n    return e('table', { style: S_TABLE },\n      e('thead', null, e('tr', null, bloc.entetes.map((t, k) => e('th', { key: k, scope: 'col', style: S_THEAD }, t)))),\n      e('tbody', null, bloc.lignes.map((l, i) => e('tr', { key: i }, l.map((c, k) => e('td', { key: k, style: S_TD }, c)))))
