document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ction-y:var(--space-32);--section-y-first:var(--space-44);\n}\n\n/* Durées/courbes non fournies par la source : valeurs proposées, à confirmer. */\n:root{--ease-out:cubic-bezier(.19,1,.22,1);--ease-inout:cubic-bezier(.65,0,.35,1);--dur-fast:200ms;--dur-base:400ms;--dur-slow:700ms;}\n\n.cc-h1{font-family:var(--font-display);font-size:var(--h1-size);line-height:var(--h1-lh);font-weight:var(--h1-wght);margin:0}\n.cc-h2{font-family:var(--font-display);font-size:var(--h2-size);line-height:var(--h2-lh);font-weight:var(--h2-wght);margin:0}\n.cc-card-title{font-family:var(--font-display);font-size:var(--card-title-size);line-height:var(--card-title-lh);font-weight:var(--card-title-wght);margin:0}\n.cc-eyebrow{font-family:var(--font-signal);font-size:var(--eyebrow-size);line-height:var(--eyebrow-lh);font-weight:var(--eyebrow-wght)}\n.cc-body{font-family:var(--font-body);font-size:var(--body-size);line-height:var(--body-lh);font-weight:var(--body-wght)}\n.cc-meta{font-family:var(--font-signal);font-size:var(--meta-size);line-height:var(--meta-lh);font-weight:var(--meta-wght)}\na{color:inherit;text-decoration:none}a:hover{color:var(--accent)}\n\n<\u002Fstyle>\n<style>\n:root { --accent-soft: color-mix(in srgb, var(--gold) 16%, var(--surface)); --alerte-fond: #f7f0df; --alerte-bord: #917a42; --erreur: #a4262c; --erreur-fond: #f9e9e9; --succes: #2e6b3f; --succes-fond: #e8f1ea; --focus: var(--ink); color-scheme: light; }\n[data-theme=\"sombre\"] { --alerte-fond: #2c2718; --alerte-bord: #c5af7e; --erreur: #ff8f86; --erreur-fond: #3a1d1c; --succes: #8fcf9f; --succes-fond: #1a2e20; color-scheme: dark; }\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { background: var(--surface); color: var(--ink); }\nbody { margin: 0; font-family: var(--font-body); font-size: 16px; line-height: 1.7; font-weight: 300; -webkit-font-smoothing: antialiased; }\nb, strong { font-weight: 500; }\na { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }\na:hover { color: var(--gold-deep); }\nbutton { font: inherit; cursor: pointer; }\nbutton:disabled { cursor: default; }\n:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }\n@media print { [data-noprint] { display: none !important; } html, body { background: #fff; color: #000; } }\n<\u002Fstyle>\n<script src=\"4f295120-55a4-4c88-80be-78928ff5b78c\"><\u002Fscript>\n<script src=\"4b75f4c6-6ed0-4acf-9bb9-aa07eb5c968b\"><\u002Fscript>\n<script src=\"47770d19-a208-433e-870c-5f03a70cdac0\"><\u002Fscript>\n<script src=\"4a1ebc8e-62f4-4b72-861f-e0b09fe0489e\"><\u002Fscript>\n<script src=\"8e8ed193-8892-43a2-a22d-f660a8f93ce0\"><\u002Fscript>\n<script src=\"1f5d37fb-4ec6-40c8-bb03-39581c61c3f3\"><\u002Fscript>\n<script src=\"aecf7b42-e2a4-4ad5-837a-887371839fbe\"><\u002Fscript>\n<script src=\"a466bfc5-2114-4955-8a48-873685244fe2\"><\u002Fscript>\n<script src=\"525c889f-bfb8-4026-a34e-5b9bf8ee433c\"><\u002Fscript>\n<script src=\"1dfd8cc2-1fd4-47d8-8c22-3c6fb4069c98\"><\u002Fscript>\n<script src=\"d588e51a-ba90-43d5-b319-633a946409b0\"><\u002Fscript>\n\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; display: flex; flex-direction: column;\">\n  <header data-noprint=\"\" style=\"background: var(--surface); border-bottom: 1px solid var(--hairline); position: sticky; top: 0; z-index: 10;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 0 24px; flex-wrap: wrap;\">\n      <a href=\"{{ lienCatalogue }}\" style=\"display: flex; align-items: center; min-height: 64px; color: var(--ink); text-decoration: none; margin-right: auto; font-family: var(--font-display); font-size: 24px; line-height: 1.1; font-weight: 300;\">Formation machines<\u002Fa>\n      <nav aria-label=\"Navigation principale\" style=\"display: flex; gap: 0 22px; flex-wrap: nowrap; overflow-x: auto; max-width: 100%;\">\n        <sc-for list=\"{{ navItems }}\" as=\"nv\" hint-placeholder-count=\"4\">\n          <a href=\"{{ nv.lien }}\" aria-current=\"{{ nv.courant }}\" style=\"display: inline-flex; align-items: center; min-height: 64px; font-family: var(--font-signal); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; text-decoration: none; color: {{ nv.couleur }}; box-shadow: inset 0 -2px 0 {{ nv.fond }};\" style-hover=\"color: var(--ink);\">{{ nv.libelle }}<\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fnav>\n      <button sc-camel-on-click=\"{{ basculerTheme }}\" aria-label=\"{{ themeAria }}\" style=\"min-height: 40px; padding: 6px 16px; border-radius: 9999px; border: 1px solid var(--control-border); background: transparent; color: var(--ink-muted); font-family: var(--font-signal); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;\" style-hover=\"color: var(--ink); border-color: var(--ink);\">{{ themeLibelle }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px;\">\n    <sc-if value=\"{{ aErreurs }}\" hint-placeholder-val=\"{{ false }}\">\n      <div role=\"alert\" style=\"background: var(--erreur-fond); border: 1px solid var(--erreur); border-radius: 0; padding: 12px 18px; margin: 20px 0 0;\">\n        <p style=\"margin: 0;\"><b>Contenu à corriger.<\u002Fb> Les éléments suivants ne respectent pas le format attendu :<\u002Fp>\n        <ul style=\"margin: 6px 0 0; padding-left: 20px;\">\n          <sc-for list=\"{{ erreursListe }}\" as=\"err\" hint-placeholder-count=\"2\"><li>{{ err }}<\u002Fli><\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <main id=\"principal\" style=\"padding: 28px 0 56px; min-width: 0;\">\n      <sc-if value=\"{{ enChargement }}\" hint-placeholder-val=\"{{ false }}\">\n        <p role=\"status\" style=\"color: var(--ink-muted); padding: 24px 0;\">Chargement des modules…<\u002Fp>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ echecChargement }}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"alert\" style=\"background: var(--erreur-fond); border: 1px solid var(--erreur); border-radius: 0; padding: 12px 18px;\">\n          <p style=\"margin: 0;\"><b>Les modules n'ont pas pu être chargés.<\u002Fb> Vérifiez que le dossier de l'outil est complet (fichiers moteur-oad.js et contenu/), puis rechargez la page.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Catalogue -->\n      <sc-if value=\"{{ estCatalogue }}\" hint-placeholder-val=\"{{ true }}\">\n        \n        <div style=\"display: grid; gap: 32px 64px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); align-items: end; padding: 40px 0 48px; border-bottom: 1px solid var(--hairline);\">\n          <div style=\"min-width: 0;\">\n            <p style=\"margin: 0 0 16px; font-family: var(--font-signal); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--gold-deep);\">Machinisme viticole<\u002Fp>\n            <h1 style=\"font-family: var(--font-display); font-size: clamp(2.4rem, 5vw, 3.4rem); line-height: 1.12; font-weight: 300; margin: 0 0 20px; text-wrap: balance;\">Modules de formation<\u002Fh1>\n            <p style=\"color: var(--ink-muted); margin: 0; max-width: 52ch; font-size: 1.06rem; text-wrap: pretty;\">Fiches, procédures, calculateurs et quiz pour régler et entretenir les machines. Fonctionne sans réseau.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 28px 28px 24px; background: var(--surface-alt); border-top: 3px solid var(--accent); min-width: 0;\">\n            <p style=\"margin: 0; font-family: var(--font-signal); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-muted);\">{{ reprise.eyebrow }}<\u002Fp>\n            <p style=\"margin: 0; font-family: var(--font-display); font-size: 1.8rem; line-height: 1.2; font-weight: 300; text-wrap: balance;\">{{ reprise.titre }}<\u002Fp>\n            <p style=\"margin: 0; color: var(--ink-muted); font-size: .95rem;\">{{ reprise.detail }}<\u002Fp>\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 10px;\">\n              <a href=\"{{ reprise.lien }}\" style=\"display: inline-flex; align-items: center; min-height: 56px; padding: 8px 32px; border-radius: 9999px; font-family: var(--font-signal); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; background: var(--accent); color: var(--on-accent); text-decoration: none;\" style-hover=\"background: var(--accent-hover); color: var(--on-accent);\">{{ reprise.action }}<\u002Fa>\n              <a href=\"{{ lienProgression }}\" style=\"font-size: .92rem; color: var(--ink-muted);\">{{ bilan.maitrises }} {{ bilan.surTxt }}<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ domainesCatalogue }}\" as=\"dom\" hint-placeholder-count=\"2\">\n          <section aria-labelledby=\"{{ dom.titreId }}\" style=\"margin: 56px 0 0;\">\n            \n            <div style=\"display: flex; align-items: baseline; gap: 12px; margin: 0 0 18px;\">\n              <h2 id=\"{{ dom.titreId }}\" style=\"font-family: var(--font-display); font-size: 2rem; line-height: 1.2; margin: 0; font-weight: 300;\">{{ dom.libelle }}<\u002Fh2>\n              <span style=\"color: var(--ink-muted); font-size: .9rem;\">{{ dom.nbTxt }}<\u002Fspan>\n            <\u002Fdiv>\n            <ul style=\"list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));\">\n              <sc-for list=\"{{ dom.modules }}\" as=\"carte\" hint-placeholder-count=\"3\">\n                <li style=\"display: flex; flex-direction: column;\">\n                  \n                  <a href=\"{{ carte.lien }}\" aria-label=\"{{ carte.titre }}\" style=\"flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 18px 20px 16px; border-radius: 0; background: var(--surface); border: 1px solid var(--hairline); border-top: 3px solid var(--accent); color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s;\" style-hover=\"border-color: var(--gold-deep); transform: translateY(-1px);\">\n                    <span style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .82rem; color: var(--ink-muted);\">\n                      <span style=\"padding: 5px 10px; border-radius: 9999px; font-family: var(--font-signal); font-weight: 700; font-size: 11px; line-height: 1; text-transform: uppercase; letter-spacing: .08em; border: 1px solid {{ carte.statutBord }}; background: {{ carte.statutFond }}; color: var(--ink);\">{{ carte.statutLibelle }}<\u002Fspan>\n                      <span>{{ carte.dureeTxt }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"font-family: var(--font-display); font-size: 1.55rem; font-weight: 300; line-height: 1.25;\">{{ carte.titre }}<\u002Fspan>\n                    <span style=\"color: var(--ink-muted); font-size: .95rem; line-height: 1.5; flex: 1; text-wrap: pretty;\">{{ carte.resume }}<\u002Fspan>\n                    <span style=\"display: flex; flex-direction: column; gap: 6px; padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--hairline);\">\n                      <span style=\"display: flex; justify-content: space-between; gap: 8px; font-size: .84rem; color: var(--ink-muted); flex-wrap: wrap;\">\n                        <span><b style=\"color: var(--ink); font-weight: 500;\">{{ carte.etatLibelle }}<\u002Fb> · {{ carte.avancementTxt }}<\u002Fspan>\n                        <span>{{ carte.quizTxt }}<\u002Fspan>\n                      <\u002Fspan>\n                      <span role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{ carte.pct }}\" aria-label=\"{{ carte.jaugeLabel }}\" style=\"display: block; height: 6px; border-radius: 999px; background: var(--surface-alt); overflow: hidden;\"><span style=\"display: block; height: 100%; border-radius: 999px; background: var(--accent); width: {{ carte.pct }}%;\"><\u002Fspan><\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fa>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n\n      <!-- Module inconnu -->\n      <sc-if value=\"{{ estInconnu }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"font-family: var(--font-display); font-size: 2rem; letter-spacing: -0.02em; margin: 12px 0;\">Module introuvable<\u002Fh1>\n        <p>Ce lien ne correspond à aucun module du catalogue. <a href=\"{{ lienCatalogue }}\">Revenir aux modules<\u002Fa><\u002Fp>\n      <\u002Fsc-if>\n\n      <!-- En-tête de module -->\n      <sc-if value=\"{{ estModule }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: grid; gap: 24px 48px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); align-items: center;\">\n        <div style=\"min-width: 0;\">\n        <p data-noprint=\"\" style=\"font-size: .9rem; color: var(--ink-muted); margin: 0 0 10px; display: flex; gap: 8px; align-items: center;\"><a href=\"{{ lienCatalogue }}\" style=\"color: var(--ink-muted);\">Modules<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan><span>{{ mod.domaineLibelle }}<\u002Fspan><\u002Fp>\n        <h1 style=\"font-family: var(--font-display); font-size: clamp(1.7rem, 3.4vw, 2.3rem); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; font-weight: 300; text-wrap: balance;\">{{ mod.titre }}<\u002Fh1>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .88rem; color: var(--ink-muted);\">\n          <span style=\"padding: 5px 10px; border-radius: 9999px; font-family: var(--font-signal); font-weight: 700; font-size: 11px; line-height: 1; text-transform: uppercase; letter-spacing: .08em; border: 1px solid {{ mod.statutBord }}; background: {{ mod.statutFond }}; color: var(--ink);\">{{ mod.statutLibelle }}<\u002Fspan>\n          <span>{{ mod.public }}<\u002Fspan>\n          <span aria-hidden=\"true\">·<\u002Fspan>\n          <span>{{ mod.dureeTxt }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ mod.nonValide }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin: 16px 0 0; padding: 10px 14px; border-radius: 0; background: var(--alerte-fond); border: 1px solid var(--alerte-bord); font-size: .9rem; line-height: 1.5;\">Contenu en cours de rédaction, pas encore validé par un expert. {{ mod.sourcesTxt }}<sc-if value=\"{{ mod.aChiffresSansSource }}\"> {{ mod.chiffresSansSourceTxt }}<\u002Fsc-if><\u002Fp>\n        <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"position: relative; width: 100%; aspect-ratio: 3 / 2; background: var(--surface-alt);\">\n          <image-slot id=\"img-entete-{{ mod.id }}\" shape=\"rect\" placeholder=\"Photo principale du module\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Page Calculateurs -->\n      <sc-if value=\"{{ estOutils }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"font-family: var(--font-display); font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.1; letter-spacing: -0.025em; margin: 12px 0 10px; font-weight: 300;\">Calculateurs<\u002Fh1>\n        <p style=\"color: var(--ink-muted); margin: 0; font-size: 1.06rem;\">Chaque résultat montre sa formule et les valeurs utilisées.<\u002Fp>\n      <\u002Fsc-if>\n\n      <!-- Grille : contenu puis sommaire dans le DOM, sommaire à gauche sur grand écran -->\n      <sc-if value=\"{{ aGrille }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: row-reverse; flex-wrap: wrap; gap: 24px; margin-top: 28px; align-items: flex-start;\">\n          <article aria-labelledby=\"titre-contenu\" style=\"flex: 999 1 520px; min-width: 0; background: var(--surface); border: 1px solid var(--hairline); border-radius: 0; padding: clamp(18px, 3.5vw, 36px);\">\n            <sc-if value=\"{{ estModule }}\">\n              <p style=\"margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-family: var(--font-signal); color: var(--gold-deep);\">\n                <span>{{ section.typeLibelle }}<\u002Fspan><span style=\"color: var(--ink-muted); font-weight: 500;\">{{ section.position }}<\u002Fspan>\n                <sc-if value=\"{{ section.aTechno }}\"><span style=\"text-transform: none; letter-spacing: 0; padding: 2px 9px; border-radius: 999px; background: var(--surface-alt); border: 1px solid var(--control-border); color: var(--ink); font-size: .78rem;\">{{ section.technoLibelle }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fp>\n              <h2 id=\"titre-contenu\" style=\"font-family: var(--font-display); font-size: clamp(1.8rem, 3vw, 2.4rem); line-height: 1.2; margin: 0 0 16px; font-weight: 300; text-wrap: balance;\">{{ section.titre }}<\u002Fh2>\n              <div style=\"position: relative; width: 100%; aspect-ratio: 16 / 7; margin: 4px 0 20px; background: var(--surface-alt);\">\n                <image-slot id=\"img-section-{{ section.cle }}\" shape=\"rect\" placeholder=\"Photo ou schéma illustrant cette section\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <sc-if value=\"{{ section.aIntro }}\"><p style=\"color: var(--ink-muted); font-size: 1.05rem; margin: 0 0 12px; max-width: 68ch; text-wrap: pretty;\">{{ section.intro }}<\u002Fp><\u002Fsc-if>\n              <sc-if value=\"{{ section.aSourceEntete }}\"><p style=\"font-size: .8rem; color: var(--ink-muted); margin: 0 0 12px;\">{{ section.sourceTxt }}<\u002Fp><\u002Fsc-if>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ estOutils }}\">\n              <h2 id=\"titre-contenu\" style=\"font-family: var(--font-display); font-size: clamp(1.8rem, 3vw, 2.4rem); line-height: 1.2; margin: 0 0 16px; font-weight: 300;\">{{ outilsTitre }}<\u002Fh2>\n              <sc-if value=\"{{ outilsMessage }}\"><p style=\"color: var(--ink-muted);\">{{ outilsMessage }}<\u002Fp><\u002Fsc-if>\n            <\u002Fsc-if>\n\n            <!-- Fiche -->\n            <sc-if value=\"{{ estFiche }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px; max-width: 72ch; margin-top: 8px;\">\n                <sc-for list=\"{{ blocs }}\" as=\"bl\" hint-placeholder-count=\"3\">\n                  <sc-if value=\"{{ bl.estParagraphe }}\"><p style=\"margin: 8px 0; text-wrap: pretty;\">{{ bl.texte }}<\u002Fp><\u002Fsc-if>\n                  <sc-if value=\"{{ bl.estFormule }}\"><p style=\"font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: .95rem; background: var(--surface-alt); padding: 12px 16px; border-radius: 0; margin: 8px 0; overflow-wrap: anywhere;\">{{ bl.texte }}<\u002Fp><\u002Fsc-if>\n                  <sc-if value=\"{{ bl.estAlerte }}\"><p style=\"margin: 10px 0; padding: 12px 16px; border-radius: 0; background: var(--alerte-fond); border: 1px solid var(--alerte-bord);\"><b>Attention :<\u002Fb> {{ bl.texte }}<\u002Fp><\u002Fsc-if>\n                  <sc-if value=\"{{ bl.estListe }}\">\n                    <ul style=\"margin: 6px 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px;\"><sc-for list=\"{{ bl.items }}\" as=\"item\"><li style=\"padding-left: 4px;\">{{ item.texte }}<sc-if value=\"{{ item.lectureGraphique }}\"><span style=\"display: block; font-size: .8rem; color: var(--ink-muted);\">Valeur lue sur un graphique de la source.<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ item.aSource }}\"><span style=\"display: block; font-size: .8rem; color: var(--ink-muted);\">{{ item.sourceTxt }}<\u002Fspan><\u002Fsc-if><\u002Fli><\u002Fsc-for><\u002Ful>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ bl.estTableau }}\"><div style=\"overflow-x: auto; max-width: 100%; margin: 10px 0; border: 1px solid var(--hairline); border-radius: 0;\">{{ bl.tableau }}<\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ bl.lectureGraphique }}\"><p style=\"font-size: .8rem; color: var(--ink-muted); margin: 0 0 8px;\">Valeur lue sur un graphique de la source.<\u002Fp><\u002Fsc-if>\n                  <sc-if value=\"{{ bl.aSource }}\"><p style=\"font-size: .8rem; color: var(--ink-muted); margin: 0 0 8px;\">{{ bl.sourceTxt }}<\u002Fp><\u002Fsc-if>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Procédure -->\n            <sc-if value=\"{{ estProcedure }}\">\n              <div style=\"display: flex; align-items: center; gap: 12px; margin: 16px 0 8px;\">\n                <p aria-live=\"polite\" style=\"margin: 0; color: var(--ink-muted); font-size: .92rem; font-variant-numeric: tabular-nums;\">{{ procedure.compteur }}<\u002Fp>\n                <span style=\"flex: 1; height: 4px; border-radius: 999px; background: var(--surface-alt); overflow: hidden; display: block;\"><span style=\"display: block; height: 100%; background: var(--accent); width: {{ procedure.pct }}%;\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <ol style=\"list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px;\">\n                <sc-for list=\"{{ procedure.etapes }}\" as=\"et\" hint-placeholder-count=\"4\">\n                  <li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 2px 12px; padding: 12px 14px; border-radius: 0; border: 1px solid var(--hairline); background: {{ et.fond }};\">\n                    <input type=\"checkbox\" id=\"{{ et.inputId }}\" checked=\"{{ et.fait }}\" sc-camel-on-change=\"{{ basculerEtape }}\" data-etape=\"{{ et.id }}\" style=\"width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--gold-deep); cursor: pointer;\">\n                    <label for=\"{{ et.inputId }}\" style=\"cursor: pointer; color: {{ et.couleur }}; text-decoration: {{ et.deco }};\"><b style=\"font-variant-numeric: tabular-nums; margin-right: 4px;\">{{ et.num }}.<\u002Fb> {{ et.texte }}<\u002Flabel>\n                    <sc-if value=\"{{ et.aDetail }}\"><p style=\"grid-column: 2; margin: 0; font-size: .9rem; color: var(--ink-muted);\">{{ et.detail }}<\u002Fp><\u002Fsc-if>\n                    <sc-if value=\"{{ et.aSource }}\"><p style=\"grid-column: 2; margin: 0; font-size: .8rem; color: var(--ink-muted);\">{{ et.sourceTxt }}<\u002Fp><\u002Fsc-if>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Fol>\n              <div data-noprint=\"\" style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px;\"><button sc-camel-on-click=\"{{ imprimer }}\" style=\"min-height: 48px; padding: 8px 26px; border-radius: 9999px; font-family: var(--font-signal); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-weight: 700;\" style-hover=\"background: var(--surface-alt);\">Imprimer la procédure<\u002Fbutton><\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Entretien -->\n            <sc-if value=\"{{ estEntretien }}\">\n              <div style=\"display: flex; align-items: center; gap: 12px; margin: 16px 0 4px;\">\n                <p aria-live=\"polite\" style=\"margin: 0; color: var(--ink-muted); font-size: .92rem; font-variant-numeric: tabular-nums;\">{{ entretien.compteur }}<\u002Fp>\n                <span style=\"flex: 1; height: 4px; border-radius: 999px; background: var(--surface-alt); overflow: hidden; display: block;\"><span style=\"display: block; height: 100%; background: var(--accent); width: {{ entretien.pct }}%;\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ entretien.groupes }}\" as=\"gr\" hint-placeholder-count=\"3\">\n                <h3 style=\"font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-family: var(--font-signal); color: var(--ink-muted); margin: 22px 0 8px;\">{{ gr.libelle }}<\u002Fh3>\n                <ul style=\"list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px;\">\n                  <sc-for list=\"{{ gr.taches }}\" as=\"ta\" hint-placeholder-count=\"2\">\n                    <li style=\"display: grid; grid-template-columns: 28px 1fr; gap: 2px 12px; padding: 12px 14px; border-radius: 0; border: 1px solid var(--hairline); background: {{ ta.fond }};\">\n                      <input type=\"checkbox\" id=\"{{ ta.inputId }}\" checked=\"{{ ta.fait }}\" sc-camel-on-change=\"{{ basculerTache }}\" data-tache=\"{{ ta.id }}\" style=\"width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--gold-deep); cursor: pointer;\">\n                      <label for=\"{{ ta.inputId }}\" style=\"cursor: pointer; color: {{ ta.couleur }}; text-decoration: {{ ta.deco }};\">{{ ta.texte }}<sc-if value=\"{{ ta.aDetail }}\"><span style=\"color: var(--ink-muted);\"> ({{ ta.detail }})<\u002Fspan><\u002Fsc-if><\u002Flabel>\n                      <sc-if value=\"{{ ta.aSource }}\"><p style=\"grid-column: 2; margin: 0; font-size: .8rem; color: var(--ink-muted);\">{{ ta.sourceTxt }}<\u002Fp><\u002Fsc-if>\n                    <\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fsc-for>\n              <div data-noprint=\"\" style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px;\"><button sc-camel-on-click=\"{{ imprimer }}\" style=\"min-height: 48px; padding: 8px 26px; border-radius: 9999px; font-family: var(--font-signal); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-weight: 700;\" style-hover=\"background: var(--surface-alt);\">Imprimer le plan d'entretien<\u002Fbutton><\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Calculateur -->\n            <sc-if value=\"{{ aCalc }}\">\n              <p style=\"color: var(--ink-muted); margin: 0 0 6px; max-width: 70ch;\">{{ calcCourant.description }}<\u002Fp>\n              <sc-if value=\"{{ calcCourant.aTechnos }}\"><p style=\"font-size: .88rem; color: var(--ink-muted); margin: 0 0 6px;\">{{ calcCourant.technosTxt }}<\u002Fp><\u002Fsc-if>\n              <div style=\"display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); margin-top: 20px;\">\n                <sc-for list=\"{{ calcCourant.entrees }}\" as=\"en\" hint-placeholder-count=\"3\">\n                  <div style=\"grid-column: {{ en.colonne }}; display: flex; flex-direction: column; gap: 4px;\">\n                    <label for=\"{{ en.inputId }}\" style=\"font-weight: 500; font-size: .95rem;\">{{ en.label }} <span style=\"font-weight: 400; color: var(--ink-muted);\">{{ en.uniteTxt }}<\u002Fspan><\u002Flabel>\n                    <sc-if value=\"{{ en.estListe }}\">\n                      <p id=\"{{ en.consigneId }}\" style=\"font-size: .85rem; color: var(--ink-muted); margin: 0;\">Séparez les valeurs par un point-virgule.<\u002Fp>\n                      <input id=\"{{ en.inputId }}\" type=\"text\" inputmode=\"text\" autocomplete=\"off\" value=\"{{ en.valeur }}\" sc-camel-on-input=\"{{ onSaisie }}\" data-calc=\"{{ en.calc }}\" data-entree=\"{{ en.id }}\" aria-describedby=\"{{ en.decritPar }}\" style=\"width: 100%; min-height: 48px; font: inherit; font-size: 1.05rem; font-variant-numeric: tabular-nums; padding: 8px 12px; border: 1px solid var(--control-border); border-radius: 0; background: var(--surface); color: var(--ink);\" style-focus=\"border-color: var(--gold-deep); background: var(--surface);\">\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ en.estNombre }}\">\n                      <input id=\"{{ en.inputId }}\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" value=\"{{ en.valeur }}\" sc-camel-on-input=\"{{ onSaisie }}\" data-calc=\"{{ en.calc }}\" data-entree=\"{{ en.id }}\" aria-describedby=\"{{ en.origineId }}\" style=\"width: 100%; min-height: 48px; font: inherit; font-size: 1.15rem; font-weight: 500; font-variant-numeric: tabular-nums; padding: 8px 12px; border: 1px solid var(--control-border); border-radius: 0; background: var(--surface); color: var(--ink);\" style-focus=\"border-color: var(--gold-deep); background: var(--surface);\">\n                    <\u002Fsc-if>\n                    <p id=\"{{ en.origineId }}\" style=\"font-size: .78rem; line-height: 1.45; color: var(--ink-muted); margin: 2px 0 0;\">Par défaut : {{ en.defautTxt }}. {{ en.origine }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div aria-live=\"polite\" style=\"margin: 24px 0 8px; padding: 6px 20px; border-radius: 0; background: var(--accent-soft);\">\n                <sc-for list=\"{{ calcCourant.resultats }}\" as=\"res\" hint-placeholder-count=\"1\">\n                  <p style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; margin: 0; padding: 12px 0; border-bottom: 1px solid var(--hairline);\"><span>{{ res.label }}<\u002Fspan> <strong style=\"font-size: 1.6rem; line-height: 1.2; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;\">{{ res.texte }}<\u002Fstrong><\u002Fp>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ calcCourant.aAlertes }}\">\n                  <ul style=\"margin: 12px 0; padding: 10px 14px 10px 30px; background: var(--alerte-fond); border: 1px solid var(--alerte-bord); border-radius: 0; font-size: .92rem;\"><sc-for list=\"{{ calcCourant.alertes }}\" as=\"al\"><li>{{ al }}<\u002Fli><\u002Fsc-for><\u002Ful>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ calcCourant.aTableau }}\">\n                <div style=\"overflow-x: auto; max-width: 100%; margin: 16px 0; border: 1px solid var(--hairline); border-radius: 0;\">{{ calcCourant.tableau }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <h3 style=\"font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-family: var(--font-signal); color: var(--ink-muted); margin: 28px 0 12px;\">Détail du calcul<\u002Fh3>\n              <ol style=\"list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px;\">\n                <sc-for list=\"{{ calcCourant.etapes }}\" as=\"fe\" hint-placeholder-count=\"1\">\n                  <li style=\"display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 12px;\">\n                    <span aria-hidden=\"true\" style=\"width: 26px; height: 26px; border-radius: 999px; background: var(--surface-alt); border: 1px solid var(--control-border); display: flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 700;\">{{ fe.num }}<\u002Fspan>\n                    <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 6px;\">\n                      <p style=\"margin: 2px 0 0; font-weight: 500;\">{{ fe.titre }}<\u002Fp>\n                      <div style=\"font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: .9rem; background: var(--surface-alt); padding: 10px 14px; border-radius: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 4px;\">\n                        <span>{{ fe.formule }}<\u002Fspan>\n                        <span style=\"color: var(--ink-muted);\">= {{ fe.substitution }} = <b style=\"color: var(--ink);\">{{ fe.resultat }}<\u002Fb><\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Fol>\n              <div data-noprint=\"\" style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px;\"><button value=\"{{ calcCourant.id }}\" sc-camel-on-click=\"{{ reinitialiserCalc }}\" style=\"min-height: 48px; padding: 8px 26px; border-radius: 9999px; font-family: var(--font-signal); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-weight: 700;\" style-hover=\"background: var(--surface-alt);\">Revenir aux valeurs par défaut<\u002Fbutton><\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Quiz -->\n            <sc-if value=\"{{ estQuiz }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 16px; margin-top: 16px;\">\n                <sc-for list=\"{{ quiz.questions }}\" as=\"qu\" hint-placeholder-count=\"2\">\n                  <fieldset style=\"border: 1px solid var(--hairline); border-radius: 0; margin: 0; padding: 16px 18px 18px; min-width: 0;\">\n                    <legend style=\"font-weight: 500; padding: 0 6px; font-size: 1.02rem;\">{{ qu.num }}. {{ qu.enonce }}<\u002Flegend>\n                    <sc-if value=\"{{ qu.multiple }}\"><p style=\"font-size: .85rem; color: var(--ink-muted); margin: 0 0 4px;\">Plusieurs réponses possibles.<\u002Fp><\u002Fsc-if>\n                    <div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 8px;\">\n                      <sc-for list=\"{{ qu.choix }}\" as=\"ch\" hint-placeholder-count=\"3\">\n                        <button type=\"button\" aria-pressed=\"{{ ch.presse }}\" value=\"{{ ch.valeur }}\" sc-camel-on-click=\"{{ onChoix }}\" disabled=\"{{ quiz.verrouille }}\" style=\"display: flex; align-items: center; gap: 12px; text-align: left; min-height: 48px; padding: 10px 14px; border-radius: 0; border: 2px solid {{ ch.bord }}; background: {{ ch.fond }}; color: var(--ink); opacity: 1;\">\n                          <span aria-hidden=\"true\" style=\"flex: none; width: 26px; height: 26px; border-radius: {{ qu.rayonMarque }}; display: flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 700; border: 2px solid {{ ch.bord }}; background: {{ ch.marque nd }};\"><b>{{ cas.verdict }}<\u002Fb> {{ cas.retour }}<\u002Fp><\u002Fsc-if>\n                <sc-if value=\"{{ cas.aSourceRetour }}\"><p style=\"font-size: .8rem; color: var(--ink-muted); margin: 8px 0 0;\">{{ cas.sourceRetourTxt }}<\u002Fp><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Glossaire -->\n            <sc-if value=\"{{ estDefinitions }}\">\n              <dl style=\"margin: 12px 0 0; display: flex; flex-direction: column;\">\n                <sc-for list=\"{{ definitions }}\" as=\"de\" hint-placeholder-count=\"3\">\n                  <dt id=\"{{ de.ancre }}\" style=\"font-weight: 700; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hairline);\">{{ de.terme }}<\u002Fdt>\n                  <dd style=\"margin: 4px 0 0; color: var(--ink-muted); max-width: 70ch;\">{{ de.definition }}<sc-if value=\"{{ de.aSource }}\"><span style=\"display: block; font-size: .8rem; margin-top: 4px;\">{{ de.sourceTxt }}<\u002Fspan><\u002Fsc-if><\u002Fdd>\n                <\u002Fsc-for>\n              <\u002Fdl>\n            <\u002Fsc-if>\n\n            <!-- Exercice -->\n            <sc-if value=\"{{ estExercice }}\">\n              <div style=\"margin: 16px 0 0; padding: 16px 18px; border-radius: 0; background: var(--surface-alt);\">\n                <p style=\"font-size: 1.06rem; margin: 0; text-wrap: pretty;\">{{ exo.enonce }}<\u002Fp>\n                <sc-if value=\"{{ exo.aSource }}\"><p style=\"font-size: .8rem; color: var(--ink-muted); margin: 8px 0 0;\">{{ exo.sourceTxt }}<\u002Fp><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"max-width: 320px; margin: 18px 0; display: flex; flex-direction: column; gap: 4px;\">\n                <label for=\"{{ exo.inputId }}\" style=\"font-weight: 500;\">Votre réponse <span style=\"font-weight: 400; color: var(--ink-muted);\">{{ exo.uniteTxt }}<\u002Fspan><\u002Flabel>\n                <input id=\"{{ exo.inputId }}\" type=\"text\" inputmode=\"decimal\" auto
