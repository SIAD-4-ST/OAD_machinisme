# Tests de parité à chaque push et pull request (D-B0-5).
# Aucune dépendance npm : l'outil distribué n'est pas concerné.
name: tests

on:
  push:
  pull_request:

jobs:
  parite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node tests/parite.test.js
